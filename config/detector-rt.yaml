# detect_rt 检测算法参数的唯一真源。
# 字段名与 src/detection-rt/include/detection_runtime.hpp 的 RuntimeConfig 一一对应；
# 只放算法参数，通道名/超时/输出目录等运行参数仍由 CLI 与 config/camera.yaml 管理。
# 旧字段 model / confidence_threshold / iou_threshold / input_size / device 已删除，
# 出现时配置加载会明确报错，不提供兼容别名。
# 下列 9 个字段全部必填，缺失或出现未知字段都会直接报错，不存在隐藏的 C++ 默认值。
detection-rt:
  # auto: 按编译后端自动选择 assets/models/yolo26n.onnx(CPU) 或 yolo26n.nb(NPU)；
  # 也可写成显式的相对/绝对模型路径。
  model_path: auto
  imgsz: 640             # 当前后端只支持 640
  num_classes: 2         # 模型类别数（现有约定 0=蓝装甲、1=红装甲）
  conf_thr: 0.25         # 置信度阈值 (0,1]
  iou_thr: 0.45          # 逐类 NMS IoU (0,1]
  max_det: 100           # 单帧最大框数，上限 300
  target_class: -1       # -1 接受所有类别；0/1 只保留指定类别
  max_hz: 10             # 检测侧限频 1..60（相机服务端另有 channels.color_max_hz）
  max_age_ms: 200        # 输入帧与结果的最大帧龄 1..2000
