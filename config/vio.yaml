# main 的 VIO 运行参数；相机规格、标定与就绪超时来自 camera.yaml，IMU 请求来自 driver.yaml。
vio:
  use_depth_init: true
  init_vel_zero: true
  static_init: false
  online_timeoffset: true
  input:
    shm_vio: /pure_uav_camera_vio
  pose:
    max_age_ms: 150
    quality_ok: 90
    quality_degraded: 50
    pos_sigma_ok_m: 0.15
    vel_sigma_ok_mps: 0.25
    pos_sigma_degraded_m: 0.5
    vel_sigma_degraded_mps: 0.8
