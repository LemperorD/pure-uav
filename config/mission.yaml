# main 必须显式传 --mission 才运行任务；--no-send 禁止任务/制导/位姿发送。
# 长度单位为米，速度单位为米/秒，时间单位为秒；所有时间和距离阈值必须为正数。
mission:
  # 起飞与到点判定：起飞和返航共用“起飞点上方”的目标位置。
  takeoff_height_m: 1.5        # 相对起飞点的上升高度；NED 坐标 z 向下，目标 z = 起飞点 z - 此值。
  position_tolerance_m: 0.20  # 到点允许的三维位置误差；必须小于起飞高度。
  settled_speed_mps: 0.20     # 到点时允许的最大速度模长，也用于起飞前的静止检查。
  settle_time_s: 0.50         # 位置误差和速度需连续达标这么久，才算起飞/返航到点；越界后重新计时。

  # 输入新鲜度与目标确认。
  pose_max_age_s: 0.20          # 飞控位置/姿态样本的最大允许年龄；过期不能通过自检，控制阶段过期则中止。
  target_max_age_s: 0.20        # 目标帧的最大允许年龄；确认目标时，相邻新帧间隔超过此值也会清空计数。
  target_lost_timeout_s: 0.50   # 撞板时距最近有效新目标帧达到此时长，退回搜索；等待期间无可用目标就暂停制导、定点保持。
  min_target_confidence: 0.60  # 任务接受目标的最低置信度，范围 [0, 1]；检测进程自身的阈值仍然生效。
  target_class: -1             # 接受的检测类别：-1=全部，0=蓝装甲板，1=红装甲板；以实际检测模型类别为准。
  target_confirm_frames: 3     # 搜索时连续确认这么多个有效新帧才进入撞板；重复帧不累计，还需有效测距和制导就绪。

  # 各阶段超时：从进入对应阶段开始计时，重新进入时重新计时。
  preflight_timeout_s: 10.0  # 进入自检后，等待连接、定位、落地、未解锁及静止等条件的时限；超时中止。
  setup_timeout_s: 10.0      # Offboard 准备和解锁各自的时限；分别等待模式/解锁反馈，超时中止。
  takeoff_timeout_s: 15.0    # 解锁后等待离地并稳定到达起飞目标的时限；超时返航，仍在地面则请求降落。
  search_timeout_s: 30.0     # 每次搜索阶段的时限；一直没确认可撞目标就返航。
  strike_timeout_s: 5.0      # 每次撞板阶段等待外部撞击确认的时限；超时返航，不视为撞击成功。
  return_timeout_s: 20.0     # 等待稳定回到起飞点上方的时限；超时改为请求飞控在当前位置自主降落。
  landing_timeout_s: 20.0    # 等待飞控确认“已落地且已上锁”的时限；超时中止。
  mission_timeout_s: 120.0   # 从接受启动请求开始计时；超时触发返航，返航/降落仍使用各自时限，不是强制停机时刻。

  # 飞控请求与 Offboard 指令流。
  request_retry_s: 1.0        # 模式切换、解锁、降落请求的最小重试间隔；发出请求不等于动作完成，仍需真实反馈。
  prestream_s: 1.5            # 请求 Offboard 前，必须连续成功发送 setpoint 的预热时长；必须小于 setup_timeout_s。
  max_setpoint_gap_s: 0.20    # 预热连续性允许的最大发送间隔；超过则清空预热计时，必须小于 prestream_s。
