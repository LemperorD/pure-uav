# 任务制导配置：PPN 视线差分。当前检测尚无测距，缺少 cam.* 时不进入撞板。
# 后续需填写检测使用的彩色相机内参及机体外参，不能直接复用 VIO 灰度标定。
guidance:
  law: PPN
  N: 4
  a_max: 10
  los_rate_source: FROM_LOS_DIFFERENCE
  freeze_criterion: BY_TGO
  t_go_freeze: 0
loop:
  loop_hz: 50
  max_sample_age_s: 0.2
  sensor_timeout_s: 0.5
  on_unhealthy: HOLD_LAST_COMMAND
  hold_last_max_s: 0.2
