# 机载 main 的 OFFBOARD 前流程配置。
# 本版本只做：连接、自检、guidance 配置初始化、arm、起飞、悬停、切 OFFBOARD。
# guidance 线程、状态机、VIO/检测初始化暂未接入。

main:
  driver_config: config/driver.yaml
  guidance_config: config/onboard-guidance.yaml
  camera_calibration: config/guidance-camera.yaml
  status_period_s: 1.0

link:
  timeout_s: 10
  heartbeat_max_age_ms: 3000
  attitude_max_age_ms: 200
  local_position_max_age_ms: 200
  system_time_max_age_ms: 2000

command:
  ack_timeout_ms: 2000
  arm_timeout_s: 5
  mode_timeout_s: 5

preflight:
  min_battery_percent: 30
  max_tilt_deg: 10.0
  max_vertical_speed_mps: 0.2

takeoff:
  altitude_m: 1.0
  timeout_s: 30
  height_tolerance_m: 0.15
  height_stable_s: 1.0

offboard:
  rate_hz: 20
  prestream_s: 1.0
