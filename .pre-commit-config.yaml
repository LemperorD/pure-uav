# See https://pre-commit.com for more information
# See https://pre-commit.com/hooks.html for more hooks
repos:
- repo: https://github.com/pre-commit/pre-commit-hooks
  rev: v6.0.0
  hooks:
  - id: trailing-whitespace # 删掉行尾空格
    exclude: '(^|/)(build|install|log|third_party)/|^src/driver/'
  - id: end-of-file-fixer # 保证文件末尾换行
    exclude: '(^|/)(build|install|log|third_party)/|^src/driver/'
  - id: check-yaml # yaml语法检查
  - id: check-added-large-files # 禁止提交大文件
  - id: check-json          # JSON语法校验
  - id: check-toml          # TOML校验
  - id: check-merge-conflict # 检查有没有残留的<<<<<<<合并标记
  - id: check-case-conflict # 大小写重名文件
  - id: detect-private-key  # 禁止提交私钥
  - id: no-commit-to-branch # 禁止直接commit到main/master
    args: [--branch, main]

# clang-format C++格式化 / clang-tidy 静态检查
- repo: https://github.com/cpp-linter/cpp-linter-hooks
  rev: v1.8.4
  hooks:
  - id: clang-format
    args: [--style=file]
    exclude: '(^|/)(build|install|log|third_party)/|^src/driver/'
  - id: clang-tidy
    args: [--version=23, --fix]
    files: \.(cpp|cc|cxx|c)$
    exclude: '(^|/)(build|install|log|third_party)/|^src/driver/|^sim_xtdrone2/|^src/app/(app_config|camera_service|pose_gate|glue/comm_imu_source)\.cpp$|^src/detection-rt/src/yolo_npu\.cpp$|^src/test/test_app/test_(detection_postprocess|heartbeat_wait|pose_gate|telemetry_freshness|vio_runtime)\.cpp$|^src/vio/estimator/(src/(depth_range|vio_runtime|shm_camera_source)\.cpp|tests/test_(camera_cadence|depth_range|shm_camera_source)\.cpp|tools/depth_range_probe\.cpp)$'

# CMake 格式：先自动修复（cmake-format），再静态检查（cmake-lint）。
# 两者共享根目录 .cmake-format.json；其中 format.dangle_parens=true
# 让闭合括号单独成行，消除 cmake-format 的「续行对齐」与 cmake-lint C0307
# 缩进规则的冲突，无需禁用任何 lint 规则。
- repo: https://github.com/cheshirekow/cmake-format-precommit
  rev: v0.6.13
  hooks:
  - id: cmake-format
    exclude: '(^|/)(build|install|log|third_party)/|^src/driver/'
  - id: cmake-lint
    exclude: '(^|/)(build|install|log|third_party)/|^src/driver/'

# Shell 脚本检查：-S error 只报致命问题
- repo: https://github.com/shellcheck-py/shellcheck-py
  rev: v0.11.0.1-1
  hooks:
  - id: shellcheck
    args: [-S, error]
    exclude: '(^|/)(build|install|log|third_party)/|^src/driver/'

# markdown 文档检查
- repo: https://github.com/DavidAnson/markdownlint-cli2
  rev: v0.22.0
  hooks:
  - id: markdownlint-cli2
    args: [--fix]
    stages: [manual]          # ← 只加这一行
    exclude: '(^|/)(build|install|log|third_party)/|^src/driver/'
