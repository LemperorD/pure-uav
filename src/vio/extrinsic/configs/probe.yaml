# 冒烟测试 / 屏摄标定预设 —— 用 --settings configs/probe.yaml 加载
#
# 只覆盖两个参数，其余全部沿用 extrinsics_config.py 的默认值。
# 正式标定（实木板 + 200 Hz 原始 IMU）不要用这份文件，用默认值。

# 相机实际 30 fps 时，默认 15 Hz 会让一半的帧根本没进入检测。
# 提到 30 后：检测尝试间隔从 66.7 ms 降到 33.3 ms，
# 触发 max_camera_gap_s=0.35 需要「连续丢 10 次」而不是「连续丢 5 次」。
# 代价：进入优化的观测数约翻倍，求解时间约翻倍。
# 觉得太慢就降到 20（空洞容限仍有 8 连丢，成本只涨 1/3）。
camera_rate_hz: 30

# 默认 0.05 s 是按 100~200 Hz IMU 定的：50 Hz 源丢 2 包就是 60 ms，直接整段拒绝。
# HIGHRES_IMU @ 50 Hz 实测中位间隔 20 ms，0.15 允许连丢 3 包。
# 实测：同一份 50 Hz + 12% 双丢包数据，默认值被拒，改成 0.15 后标定通过
# （0.0406° / 5.45 mm / 0.66 ms，对照 200 Hz 的 0.0406° / 3.35 mm / 0.04 ms）。
# 这是放宽护栏，不是作弊：它只影响「多长的 IMU 空洞可以容忍」，
# 空洞本身仍会体现在残差里，跑完必须看 gyro/accel RMS。
max_imu_gap_s: 0.15
